apiVersion: v1
data:
  password: cGFzcw==
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "18"
  name: postgres-user-pass
  namespace: default

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "18"
  name: postgres
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: postgres
  selector:
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgres
status:
  loadBalancer: {}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/version: "18"
  name: postgres
  namespace: default
spec:
  minReadySeconds: 50
  selector:
    matchLabels:
      app.kubernetes.io/instance: postgres
      app.kubernetes.io/name: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/version: "18"
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-user-pass
        image: postgres:18-alpine3.22
        name: postgres
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
  updateStrategy: {}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/version: "18"
      name: pgdata
    spec:
      resources:
        requests:
          storage: 50Gi
      storageClassName: ceph
    status: {}
status:
  availableReplicas: 0
  replicas: 0
